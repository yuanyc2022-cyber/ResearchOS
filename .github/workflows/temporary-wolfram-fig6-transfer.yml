name: Temporary Wolfram Fig6 transfer

on:
  push:
    paths:
      - '.github/workflows/temporary-wolfram-fig6-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download Base64 generated by Wolfram and decode PDF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 --user-agent 'Mozilla/5.0' 'https://paste.rs/qvGDX' -o fig6.b64
          tr -d '\r\n' < fig6.b64 | base64 --decode > fig6.pdf
          test "$(stat -c%s fig6.pdf)" -eq 21543
          echo '2ce43d9f377b1fe1cc4344d291b07b8b6debb14e2783c40a4c5d149fb95e69bf  fig6.pdf' | sha256sum -c -
          file fig6.pdf
      - name: Upload Wolfram-generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: DSS-Wolfram-Fig6-Revised
          path: fig6.pdf
          if-no-files-found: error
          retention-days: 1
