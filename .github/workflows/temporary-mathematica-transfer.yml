name: Temporary Mathematica figure transfer

on:
  push:
    paths:
      - '.github/workflows/temporary-mathematica-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected Mathematica Figure 5
        shell: bash
        run: |
          set -euo pipefail
          landing='https://tmpfiles.org/wXwxh7gj3m6n/fig5_local_capability_path.pdf'
          curl --fail --location --retry 5 --retry-delay 2 --user-agent 'Mozilla/5.0' "$landing" -o landing.html
          signed=$(grep -oE 'https://tmpfiles.org/dl/[^" ]+/wXwxh7gj3m6n/fig5_local_capability_path.pdf' landing.html | head -n 1)
          test -n "$signed"
          curl --fail --location --retry 5 --retry-delay 2 --user-agent 'Mozilla/5.0' "$signed" -o fig5.pdf
          file fig5.pdf
          test "$(head -c 4 fig5.pdf)" = '%PDF'
      - name: Upload corrected Mathematica Figure 5
        uses: actions/upload-artifact@v4
        with:
          name: DSS-Corrected-Mathematica-Figure-5
          path: fig5.pdf
          if-no-files-found: error
          retention-days: 1
